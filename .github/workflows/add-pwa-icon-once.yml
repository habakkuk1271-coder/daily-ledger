name: Wire PWA icon once
on:
  push:
    paths:
      - '.github/workflows/add-pwa-icon-once.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire icon and manifest
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<meta name="apple-mobile-web-app-title" content="日日帳"><title>日日帳 V1.2.4</title>'
          new='<meta name="apple-mobile-web-app-title" content="日日帳"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>日日帳 V1.2.5</title>'
          if old not in s:
              raise SystemExit('Expected head marker not found')
          s=s.replace(old,new,1)
          s=s.replace('Google Sheet 是正式資料庫；本機保留快取與離線容錯。V1.2.4','Google Sheet 是正式資料庫；本機保留快取與離線容錯。V1.2.5',1)
          p.write_text(s)
      - name: Verify wiring
        run: |
          grep -q 'apple-touch-icon.png' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q '日日帳 V1.2.5' index.html
          test -s apple-touch-icon.png
          test -s manifest.webmanifest
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Wire home screen icon and PWA manifest V1.2.5'
          git push origin HEAD:main
