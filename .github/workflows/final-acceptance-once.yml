name: Final acceptance once
on:
  push:
    paths:
      - '.github/workflows/final-acceptance-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static structural checks
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re
          html=Path('index.html').read_text(encoding='utf-8')
          code=Path('apps-script/Code.gs').read_text(encoding='utf-8')
          manifest=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert '\ufffd' not in html, 'replacement character found in index.html'
          required_tabs=['data-tab="ledger"','data-tab="budget"','data-tab="history"','data-tab="trend"']
          for x in required_tabs: assert x in html, f'missing tab {x}'
          cats=['餐飲','交通','日用品','娛樂','服飾','保險','電信規費','奉獻款','其他']
          for c in cats: assert f'<option>{c}</option>' in html, f'missing category {c}'
          assert '保險、電信規費' not in html, 'old merged category still exists'
          for card in ['永豐信用卡','國泰cube卡','富邦possible卡','聯邦吉鶴卡','台新信用卡']:
              assert card in html, f'missing card {card}'
          for t in ['value="expense"','value="income"','value="reserve"','value="repayment"']:
              assert t in html, f'missing record type {t}'
          for s in ['pendingUpserts','pendingDeletes','pendingSettings','flushPending','loadRemote','cardStatus','previousOverspend']:
              assert s in html, f'missing sync/core symbol {s}'
          assert 'daily-ledger-access-key' in html, 'access key localStorage key missing'
          assert 'access_key_not_configured' in html and 'unauthorized' in html, 'auth error handling missing'
          assert "if (action !== 'ping') requireAccess_(p.key);" in code, 'GET auth gate missing'
          assert 'requireAccess_(body.key);' in code, 'POST auth gate missing'
          assert "version:3,auth:'required'" in code, 'ping auth version missing'
          assert 'LockService.getScriptLock()' in code and 'lock.waitLock(10000)' in code, 'script locking missing'
          assert manifest['display']=='standalone'
          assert manifest['start_url']=='./' and manifest['scope']=='./'
          assert manifest['icons'][0]['src']=='apple-touch-icon.png'
          assert Path('apple-touch-icon.png').exists() and Path('apple-touch-icon.png').stat().st_size>0
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k=='id' and v: self.ids.append(v)
          p=P(); p.feed(html)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          assert not dup, f'duplicate HTML ids: {dup}'
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html,flags=re.I)
          assert scripts, 'no inline script found'
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('STATIC PASS')
          PY
      - name: JavaScript syntax check
        run: node --check /tmp/app.js
      - name: Apps Script syntax check
        run: cp apps-script/Code.gs /tmp/code.js && node --check /tmp/code.js
      - name: Live backend unauthenticated security check
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbxcaxSgwLjudxZ0RpgOOxLfjJoAKmmZFBIbgOIxbFsLNP5lO2rv7L1jCQfVGnnBOta2/exec'
          ping=$(curl -fsSL --retry 3 --max-time 20 "$BASE?action=ping")
          echo "$ping" | grep -q '"ok":true'
          echo "$ping" | grep -q '"version":3'
          echo "$ping" | grep -q '"auth":"required"'
          noauth=$(curl -fsSL --retry 3 --max-time 20 "$BASE?action=load")
          echo "$noauth" | grep -q '"ok":false'
          echo "$noauth" | grep -q '"error":"unauthorized"'
          wrong=$(curl -fsSL --retry 3 --max-time 20 "$BASE?action=load&key=definitely-wrong-final-acceptance-key")
          echo "$wrong" | grep -q '"ok":false'
          echo "$wrong" | grep -q '"error":"unauthorized"'
          echo 'LIVE AUTH PASS'
