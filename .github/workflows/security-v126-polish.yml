name: Security V1.2.6 polish
on:
  push:
    paths:
      - '.github/workflows/security-v126-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v126
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('Google Sheet 是正式資料庫；本機保留快取與離線容錯。V1.2.5','Google Sheet 是正式資料庫；本機保留快取與離線容錯。V1.2.6',1)
          old="if(!err&&v&&!v.ok&&String(v.error||'').includes('unauthorized')){forgetAccessKey();setSync('存取碼錯誤，請重新輸入');}"
          new="if(!err&&v&&!v.ok){let msg=String(v.error||'');if(msg.includes('unauthorized')){forgetAccessKey();setSync('存取碼錯誤，請重新輸入');}else if(msg.includes('access_key_not_configured'))setSync('伺服器尚未設定私人存取碼');}"
          if old not in s: raise SystemExit('auth response block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - run: |
          grep -q 'V1.2.6</div>' index.html
          grep -q 'access_key_not_configured' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('<script>')==1 and s.count('</script>')==1
          print('polish checks ok')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Polish security setup feedback V1.2.6'
          git push origin HEAD:security-v126
