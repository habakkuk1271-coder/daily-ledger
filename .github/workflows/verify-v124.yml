name: Verify V1.2.4
on:
  push:
    branches: [sync-hardening-v124c]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML and JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert '<title>日日帳 V1.2.4</title>' in s
          assert s.count('<script>')==1 and s.count('</script>')==1
          assert s.count('<html')==1 and s.count('</html>')==1
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          required=['pendingUpserts','pendingDeletes','pendingSettings','flushPending','hasMonthSetting','if(!hasMonthSetting(pk))return 0']
          for x in required: assert x in s, x
          PY
          node --check /tmp/app.js
      - name: Verify high-risk sync invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          checks={
            'delete tombstone': "state.pendingDeletes[String(id)]=true" in s,
            'undo cancels tombstone': "delete state.pendingDeletes[String(deletedBuffer.id)]" in s,
            'local-only record retained during merge': "if(state.pendingUpserts[id]||!q||String(r.updatedAt||'')>String(q.updatedAt||''))map.set(id,r)" in s,
            'pending settings protected from cloud overwrite': "if(!state.pendingSettings[k])state.monthlySettings[k]" in s,
            'no false carry without prior setting': "if(!hasMonthSetting(pk))return 0" in s,
            'reserve guard': "待預留只有" in s,
            'repayment guard': "待償只有" in s,
          }
          bad=[k for k,v in checks.items() if not v]
          assert not bad, bad
          print('Verified:', ', '.join(checks))
          PY