name: Inspect core functions once
on:
  push:
    paths:
      - '.github/workflows/list-functions-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected core function bodies
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          def body(name):
              pos=s.find('function '+name+'(')
              if pos<0: return 'NOT FOUND'
              i=s.find('{',pos)
              depth=0; quote=None; esc=False; j=i
              while j<len(s):
                  c=s[j]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return s[pos:j+1]
                  j+=1
              return 'UNTERMINATED'
          for n in ['migrate','carryDeduction','stats','previousOverspend','cardStatus','flushPending','loadRemote','currentDayStats','renderTrend','saveRecord','createCarryRecord','applyCarryFor','resetBudgetCarry','exportCharts']:
              print('===== '+n+' =====')
              print(body(n))
          PY
