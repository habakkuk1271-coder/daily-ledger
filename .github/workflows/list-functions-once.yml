name: Final deployed page check
on:
  push:
    paths:
      - '.github/workflows/list-functions-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final repository state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          assert '日日帳 V1.2.7' in s and 'V1.2.6' not in s
          assert '<option>保險</option><option>電信規費</option>' in s
          assert '保險、電信規費' not in s
          assert '已與 Google Sheet 完整核對同步' in s
          assert 'Object.entries(state.pendingUpserts).forEach' in s
          assert 'let nextSettings={}' in s
          assert '\ufffd' not in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s,flags=re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          m=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert m['display']=='standalone' and m['icons'][0]['src']=='apple-touch-icon.png'
          PY
          node --check /tmp/app.js
          cp apps-script/Code.gs /tmp/code.js && node --check /tmp/code.js
      - name: Wait for and verify GitHub Pages V1.2.7
        run: |
          set -euo pipefail
          URL='https://habakkuk1271-coder.github.io/daily-ledger/'
          ok=0
          for i in $(seq 1 24); do
            page=$(curl -fsSL --max-time 20 "$URL" || true)
            if echo "$page" | grep -q '日日帳 V1.2.7'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          echo "$page" | grep -q '<option>保險</option><option>電信規費</option>'
          ! echo "$page" | grep -q '保險、電信規費'
          echo "$page" | grep -q '已與 Google Sheet 完整核對同步'
          curl -fsSI --max-time 20 'https://habakkuk1271-coder.github.io/daily-ledger/manifest.webmanifest' >/dev/null
          curl -fsSI --max-time 20 'https://habakkuk1271-coder.github.io/daily-ledger/apple-touch-icon.png' >/dev/null
      - name: Verify live backend access protection
        run: |
          set -euo pipefail
          BASE='https://script.google.com/macros/s/AKfycbxcaxSgwLjudxZ0RpgOOxLfjJoAKmmZFBIbgOIxbFsLNP5lO2rv7L1jCQfVGnnBOta2/exec'
          ping=$(curl -fsSL --max-time 20 "$BASE?action=ping")
          echo "$ping" | grep -q '"ok":true'
          echo "$ping" | grep -q '"version":3'
          echo "$ping" | grep -q '"auth":"required"'
          noauth=$(curl -fsSL --max-time 20 "$BASE?action=load")
          echo "$noauth" | grep -q '"error":"unauthorized"'
